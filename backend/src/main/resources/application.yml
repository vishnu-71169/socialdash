server:
  port: 8080

spring:
  application:
    name: socialdash
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/socialdash}
    username: ${DB_USERNAME:socialdash}
    password: ${DB_PASSWORD:socialdash}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Dev-only default. Override with JWT_SECRET (base64, >= 32 bytes) everywhere else.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc29jaWFsZGFzaC1qd3Qtc2VjcmV0LWNoYW5nZS1tZS0xMjM0NTY3ODk=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  # AES-256 key (base64, 32 bytes) used to encrypt platform access tokens at rest. Dev-only default.
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:c29jaWFsZGFzaC1kZXYtdG9rZW4ta2V5LTMyLWJ5dGU=}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo:
    seed: ${DEMO_SEED:true}
  publishing:
    max-attempts: 3
    retry-base-delay-seconds: 30
    stuck-timeout-seconds: 300
    batch-size: 50
  simulation:
    publish-failure-rate: ${SIM_PUBLISH_FAILURE_RATE:0.15}
  scheduler:
    publish-interval-ms: 15000
    analytics-interval-ms: 120000
    listening-interval-ms: 120000
    engagement-interval-ms: 180000
