server:
  port: 8080

spring:
  application:
    name: socialdash
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/socialdash}
    username: ${DB_USERNAME:socialdash}
    password: ${DB_PASSWORD:socialdash}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Dev-only default. Override with JWT_SECRET (base64, >= 32 bytes) everywhere else.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc29jaWFsZGFzaC1qd3Qtc2VjcmV0LWNoYW5nZS1tZS0xMjM0NTY3ODk=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  # AES-256 key (base64, 32 bytes) used to encrypt platform access tokens at rest. Dev-only default.
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:c29jaWFsZGFzaC1kZXYtdG9rZW4ta2V5LTMyLWJ5dGU=}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  demo:
    seed: ${DEMO_SEED:true}
  publishing:
    max-attempts: 3
    retry-base-delay-seconds: 30
    stuck-timeout-seconds: 300
    batch-size: 50
  simulation:
    publish-failure-rate: ${SIM_PUBLISH_FAILURE_RATE:0.15}
  meta:
    base-url: https://graph.facebook.com
    api-version: ${META_API_VERSION:v26.0}
    # Optional. Never commit these - set them as environment variables.
    app-id: ${META_APP_ID:}
    app-secret: ${META_APP_SECRET:}
    # Live accounts are refreshed at most this often by the background jobs (Meta rate-limits API calls).
    sync-interval-minutes: 15
    # Days of history fetched when a live account is connected.
    backfill-days: 14
    instagram-views-metric: views
    facebook-views-metric: page_media_view
    facebook-reactions-metric: page_actions_post_reactions_total
    facebook-post-views-metric: post_media_view
  scheduler:
    publish-interval-ms: 15000
    analytics-interval-ms: 120000
    listening-interval-ms: 120000
    engagement-interval-ms: 180000
