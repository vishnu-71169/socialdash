# Local PostgreSQL for the backend's default profile.
#   docker compose up -d
services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: socialdash
      POSTGRES_USER: socialdash
      POSTGRES_PASSWORD: socialdash
    ports:
      - "5432:5432"
    volumes:
      - socialdash-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialdash -d socialdash"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  socialdash-pg:
